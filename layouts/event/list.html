{{ define "main" }}
<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6" x-data="gwDetail()">

  {{/* breadcrumb */}}
  <p class="font-mono text-[11px] text-dim">
    <span class="text-neon">~/calendar</span> / event / <span class="text-ash" x-text="slug || '—'"></span> <span class="gw-cursor">▮</span>
  </p>

  {{/* loading */}}
  <div x-show="!$store.gw.ready" class="py-24 text-center font-mono text-sm text-dim">
    RETRIEVING RECORD <span class="gw-cursor">▮</span>
  </div>

  {{/* not found */}}
  <template x-if="$store.gw.ready && !ev">
    <div class="py-16 text-center">
      <div class="font-mono text-5xl font-extrabold text-amber gw-glow-amber">404</div>
      <p class="mt-3 font-mono text-sm tracking-[0.2em] text-dim">SIGNAL NOT FOUND ON THE WIRE</p>
      <a href="/" class="btn btn-neon mt-8">← BACK TO CALENDAR</a>
    </div>
  </template>

  {{/* record */}}
  <template x-if="$store.gw.ready && ev">
    <div class="mt-6 grid gap-10 lg:grid-cols-[minmax(0,1fr)_320px]">

      <article class="animate-rise">
        <div class="flex flex-wrap items-center gap-2">
          <span class="badge" :class="ev.type === 'exchange' ? 'badge-ex' : 'badge-ec'"
                x-text="ev.type === 'exchange' ? 'EXCHANGE' : 'ECONOMICS'"></span>
          <span class="border border-white/10 px-2 py-0.5 font-mono text-[11px]"
                :class="ev.past ? 'text-dim' : 'text-neon'" x-text="gwFmtLong(ev.date)"></span>
          <span class="text-xl" x-text="ev.flag"></span>
        </div>

        <h1 class="mt-4 font-mono text-3xl font-extrabold leading-tight text-white sm:text-4xl lg:text-[2.75rem]"
            x-text="ev.title"></h1>

        {{/* meta grid */}}
        <div class="mt-6 grid divide-y divide-white/10 border border-white/10 bg-panel sm:grid-cols-3 sm:divide-x sm:divide-y-0">
          <div class="px-4 py-3">
            <div class="label-hh">DATE</div>
            <div class="font-mono text-lg font-bold text-white" x-text="gwFmtLong(ev.date)"></div>
          </div>
          <div class="px-4 py-3">
            <div class="label-hh">SOURCE BULLETIN</div>
            <a :href="ev.url" target="_blank" rel="noopener"
               class="font-mono text-sm text-neon underline-offset-4 hover:underline" x-text="ev.source + ' ↗'"></a>
          </div>
          <div class="px-4 py-3">
            <div class="label-hh">CLASSIFICATION</div>
            <div class="font-mono text-sm text-ash" x-text="ev.type.toUpperCase() + ' / ' + ((ev.tags && ev.tags[0]) || '—')"></div>
          </div>
        </div>

        {{/* description */}}
        <div class="mt-6 border-l-2 border-neon bg-panel p-5 sm:p-6">
          <div class="label-hh !mb-3">DESCRIPTION</div>
          <p class="whitespace-pre-line text-[15px] leading-8 text-ash/90" x-text="ev.description"></p>
        </div>

        {{/* tags → homepage keyword filter */}}
        <div class="mt-5 flex flex-wrap gap-2" x-show="ev.tags && ev.tags.length">
          <template x-for="t in (ev.tags || [])" :key="t">
            <a :href="'/?q=' + encodeURIComponent(t)" class="chip" x-text="'#' + t"></a>
          </template>
        </div>

        {{/* actions */}}
        <div class="mt-8 flex flex-wrap gap-3">
          <a :href="gcal()" target="_blank" rel="noopener" class="btn btn-neon">+ GOOGLE CALENDAR</a>
          <button @click="ics()" class="btn btn-ghost">↓ DOWNLOAD .ICS</button>
          <a :href="ev.url" target="_blank" rel="noopener" class="btn btn-ghost">↗ SOURCE BULLETIN</a>
        </div>
      </article>

      {{/* related rails */}}
      <aside class="space-y-6">
        <div class="border border-white/10 bg-panel">
          <div class="border-b border-white/10 px-4 py-2.5 font-mono text-[10px] tracking-[0.3em] text-dim">
            // SAME WIRE — <span x-text="ev.source"></span>
          </div>
          <ul class="divide-y divide-white/[0.04]">
            <template x-for="r in sameSource" :key="r.slug">
              <li>
                <a :href="'/event/#' + r.slug" class="group flex items-center gap-3 px-4 py-2.5 transition-colors hover:bg-panel2/70">
                  <span class="w-14 shrink-0 font-mono text-[10px]" :class="r.past ? 'text-dim' : 'text-neon'" x-text="gwFmtShort(r.date)"></span>
                  <span class="truncate font-mono text-xs text-ash group-hover:text-white" x-text="r.title"></span>
                  <span class="ml-auto text-dim transition-colors group-hover:text-neon">→</span>
                </a>
              </li>
            </template>
            <li x-show="!sameSource.length" class="px-4 py-3 font-mono text-[11px] text-dim/60">NO OTHER TRAFFIC FROM THIS VENUE.</li>
          </ul>
        </div>

        <div class="border border-white/10 bg-panel">
          <div class="border-b border-white/10 px-4 py-2.5 font-mono text-[10px] tracking-[0.3em] text-dim">// SAME DAY</div>
          <ul class="divide-y divide-white/[0.04]">
            <template x-for="r in sameDay" :key="r.slug">
              <li>
                <a :href="'/event/#' + r.slug" class="group flex items-center gap-3 px-4 py-2.5 transition-colors hover:bg-panel2/70">
                  <span x-text="r.flag"></span>
                  <span class="truncate font-mono text-xs text-ash group-hover:text-white" x-text="r.title"></span>
                  <span class="ml-auto text-dim group-hover:text-neon">→</span>
                </a>
              </li>
            </template>
            <li x-show="!sameDay.length" class="px-4 py-3 font-mono text-[11px] text-dim/60">CALENDAR QUIET THIS DAY.</li>
          </ul>
        </div>

        <div class="border border-white/10 bg-panel p-4">
          <div class="label-hh">RAW FEED</div>
          <p class="font-mono text-[11px] leading-5 text-dim">
            Machine-readable: <a class="text-neon hover:underline" href="/events.json">/events.json</a>
            · <a class="text-neon hover:underline" href="/index.xml">RSS</a>
          </p>
        </div>
      </aside>
    </div>
  </template>
</div>
{{ end }}
