<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ event.onClick }}" title="{{ event.tooltip }}" style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer">
  <span style="font-size:16px;width:22px;text-align:center;flex:none">{{ event.flag }}</span>
  <div style="flex:1;min-width:0">
    <div style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ event.title }}</div>
    <div style="font-size:11.5px;color:rgba(192,192,192,0.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ event.source }} · {{ event.dateLabel }}</div>
  </div>
  <sc-if value="{{ event.isToday }}" hint-placeholder-val="{{ false }}">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#ffb700;background:rgba(255,183,0,0.1);border:1px solid rgba(255,183,0,0.3);padding:3px 7px;border-radius:3px;flex:none">TODAY</span>
  </sc-if>
  <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ event.badgeColor }};background:{{ event.badgeBg }};border:1px solid {{ event.badgeBorder }};padding:3px 8px;border-radius:3px;letter-spacing:0.5px;width:76px;text-align:center;flex:none">{{ event.typeLabel }}</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:56},&quot;event&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
