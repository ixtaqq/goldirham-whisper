baseURL = "/"
locale = "en-US"
title = "Goldirham Whisper"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
disableHugoGeneratorInject = true

[params]
  description = "Under-the-radar economic releases and exchange infrastructure dates that move markets first."
  author = "The Goldirham Whisper"

[minify]
  # Legacy from the old DC-runtime SPA (removed) which used literal {{ }} as
  # its own binding syntax, which Hugo's HTML minifier tried to parse as Go
  # template actions. layouts/partials/app.html no longer does this, so this
  # could likely be re-enabled — just hasn't been tested.
  disableHTML = true

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS", "EVENTSJSON"]

[outputFormats.EVENTSJSON]
  mediaType = "application/json"
  baseName = "events"
  isPlainText = true
  notAlternative = true
  noUgly = true